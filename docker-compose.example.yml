services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-KelvCMC}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kelvcmc}
      DB_USERNAME: ${DB_USERNAME:-kelvcmc}
      DB_PASSWORD: ${DB_PASSWORD:-kelvcmc}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
    depends_on:
      database:
        condition: service_healthy
    networks:
      - kelvcmc

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-kelvcmc}
      MARIADB_USER: ${DB_USERNAME:-kelvcmc}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kelvcmc}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
    volumes:
      - kelvcmc-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - kelvcmc

volumes:
  kelvcmc-db:

networks:
  kelvcmc:
    driver: bridge
